# The iPhone app on macOS runners: the store build for the simulator (launched, screenshot) and for
# devices (an ad-hoc signed .ipa to re-sign for the test iPhone), also signed for the App Store when the
# signing secrets exist (docs/ios.md). Only a run with store: upload sends a build to TestFlight, and only
# once the simulator e2e passed: the release timer (tools/release.mjs) starts one for each new version on
# main. Nothing here releases to the App Store, and the Android and Play releases don't go through GitHub
# Actions.
name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      signup:
        description: "e2e: also make a production account, check the account screens, and delete it"
        type: boolean
        default: true
      store:
        description: "Device build: sign for the App Store, then check it with Apple (validate) or send it to TestFlight (upload)"
        type: choice
        options: [sign, validate, upload]
        default: sign

env:
  CARGO_TERM_COLOR: always
  # The iPhone build number's last part (tools/ios.sh build_number).
  IOS_BUILD: ${{ github.run_number }}
  DX_VERSION: 0.7.10

jobs:
  simulator:
    name: Simulator e2e and screenshots
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim, aarch64-apple-ios
          # dx strips the app with rust-objcopy.
          components: clippy, llvm-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ios-${{ runner.os }}-cargo-

      - name: Check (fails fast on code that doesn't build for iOS)
        run: cargo clippy --locked --target aarch64-apple-ios-sim --no-default-features --features play -- -D warnings

      - name: Install dioxus-cli
        run: |
          curl -fsSLO https://github.com/DioxusLabs/dioxus/releases/download/v$DX_VERSION/dx-aarch64-apple-darwin.tar.gz
          curl -fsSL https://github.com/DioxusLabs/dioxus/releases/download/v$DX_VERSION/dx-aarch64-apple-darwin.sha256 -o dx.sha256
          cat dx.sha256
          [ "$(shasum -a 256 dx-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" = "$(grep -oE '[0-9a-f]{64}' dx.sha256 | head -1)" ]
          mkdir -p ~/.local/bin && tar -xzf dx-aarch64-apple-darwin.tar.gz -C ~/.local/bin
          echo ~/.local/bin >> $GITHUB_PATH
          ~/.local/bin/dx --version | grep -F "$DX_VERSION"

      - name: e2e in the simulator (guest; by hand, also a new account deleted at the end)
        env:
          # A push doesn't make production accounts; running the workflow by hand does (and deletes it).
          E2E_SIGNUP: ${{ github.event_name == 'workflow_dispatch' && inputs.signup && '1' || '0' }}
          # Through e2e/flaky-proxy.mjs, so answers in the background can be scripted to take a while.
          E2E_PROXY: '1'
        run: tools/ios.sh e2e

      - name: The store build launches and keeps running in the simulator
        run: WAIT=20 SIM_NAME="Pro Max" tools/ios.sh sim

      - name: Diagnostics
        if: always()
        run: |
          mkdir -p target/ios
          id=$(sed -n '/^\[ios\]/,/^\[/s/^identifier = "\(.*\)"/\1/p' Dioxus.toml)
          xcrun simctl io booted screenshot target/ios/screenshot-end.png || true
          xcrun simctl spawn booted log show --last 10m --style compact --predicate 'process CONTAINS[c] "obscurify" OR subsystem CONTAINS[c] "obscurify"' > target/ios/app.log 2>&1 || true
          tail -40 target/ios/app.log || true
          cp ~/Library/Logs/DiagnosticReports/*.ips target/ios/ 2>/dev/null || true
          ls target/ios
          # The app's files: chats and settings go in Library/Application Support.
          data=$(xcrun simctl get_app_container booted "$id" data 2>/dev/null) && find "$data/Library" -maxdepth 2 | tee target/ios/container.txt || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obscurify-ios-simulator
          path: target/ios
          if-no-files-found: warn

  device:
    name: Device build (aarch64-apple-ios)
    # A TestFlight upload waits for the simulator e2e and goes only if it passed.
    needs: simulator
    if: always() && (inputs.store != 'upload' || needs.simulator.result == 'success')
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      SIGNING: ${{ secrets.IOS_DIST_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: llvm-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-device-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ios-device-${{ runner.os }}-cargo-

      - name: Install dioxus-cli
        run: |
          curl -fsSLO https://github.com/DioxusLabs/dioxus/releases/download/v$DX_VERSION/dx-aarch64-apple-darwin.tar.gz
          curl -fsSL https://github.com/DioxusLabs/dioxus/releases/download/v$DX_VERSION/dx-aarch64-apple-darwin.sha256 -o dx.sha256
          [ "$(shasum -a 256 dx-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" = "$(grep -oE '[0-9a-f]{64}' dx.sha256 | head -1)" ]
          mkdir -p ~/.local/bin && tar -xzf dx-aarch64-apple-darwin.tar.gz -C ~/.local/bin
          echo ~/.local/bin >> $GITHUB_PATH

      - name: Build the device app and .ipa
        run: tools/ios.sh device

      # App Store signing (docs/ios.md): only when the signing secrets exist (not on forks). A push
      # signs; validate and upload are by hand. Nothing signed or secret goes into the artifacts.
      - name: Keychain with the distribution certificate
        if: env.SIGNING == 'true'
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          kc=$RUNNER_TEMP/signing.keychain-db
          kp=$(uuidgen)
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          printf '%s' "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
          printf '%s' "$IOS_PROFILE" | base64 --decode > "$RUNNER_TEMP/store.mobileprovision"

      - name: Sign for the App Store (${{ inputs.store || 'sign' }})
        if: env.SIGNING == 'true'
        env:
          PROFILE: ${{ runner.temp }}/store.mobileprovision
          SKIP_BUILD: 1
          STORE: ${{ inputs.store == 'validate' && 'validate' || inputs.store == 'upload' && 'upload' || '' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: tools/ios.sh store

      - name: Remove the keychain and the key
        if: always() && env.SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect "$RUNNER_TEMP/store.mobileprovision"

      - name: Describe
        run: |
          cd target/ios-device
          codesign -dv --verbose=2 Obscurify.app 2>&1 | tee codesign.txt
          xcrun vtool -show-build Obscurify.app/obscurify | tee build-version.txt
          plutil -p Obscurify.app/Info.plist > Info.plist.txt
          find Obscurify.app | sort > files.txt
          ls -la Obscurify.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: obscurify-ios-device
          path: |
            target/ios-device/Obscurify.ipa
            target/ios-device/*.txt
          if-no-files-found: error
