[package]
name = "obscurify"
version = "0.8.14"
edition = "2024"
license = "GPL-3.0-only"
description = "Obscurify for Android: private AI chat, paid for with unlinkable vouchers"
repository = "https://github.com/Obscurify-ai/obscurify-android"

# Android versionCode: 1000000 + major*10000 + minor*100 + patch. Bump it with the version.
[package.metadata.android]
version-code = 1000814

[dependencies]
dioxus = { version = "0.7.10", features = ["mobile"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
futures-util = "0.3"
blind-rsa-signatures = { version = "0.18", default-features = false }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10"
futures-channel = "0.3"
tokio = { version = "1", features = ["time"] }
pdf-extract = "0.12"
calamine = "0.38"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Checks TEE replies on the phone (Verify). Path until the repo is published.
obscurify-tee-verify = { git = "https://github.com/Obscurify-ai/tee-verify", rev = "b8bf3b3746d4d81a2d4d44f8bad6d50a28014b28" }
bytes = "1"

[profile.release]
opt-level = "s"
strip = true
lto = true
