[package]
name = "obscurify"
version = "0.8.60"
edition = "2024"
license = "GPL-3.0-only"
description = "Obscurify for Android: private AI chat, paid for with unlinkable vouchers"
repository = "https://github.com/Obscurify-ai/obscurify-android"

# Android versionCode: 1000000 + major*10000 + minor*100 + patch. Bump it with the version.
[package.metadata.android]
version-code = 1000860

[features]
# The Google Play build (`./build.sh play`): its own app, ai.obscurify.play, with no payments in the
# app and no uncensored or roleplay models. Off by default: the sideload and F-Droid builds leave it out.
play = []
# In-app Tor (Arti): the Tor button and "Always connect through Tor". On by default; the Play build
# is made with --no-default-features and leaves it out, as it leaves out the Tor button.
default = ["tor"]
# The iPhone app's e2e build (tools/ios.sh e2e): e2e/ios/driver.js drives the app in the simulator.
# Test builds only; `tools/ios.sh device` refuses it and checks the binary.
e2e = ["play"]
tor = ["dep:arti-client", "dep:tor-rtcompat", "dep:rustls", "tokio/rt-multi-thread", "tokio/net", "tokio/io-util"]

[dependencies]
dioxus = { version = "0.7.10", features = ["mobile"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
futures-util = "0.3"
blind-rsa-signatures = { version = "0.18", default-features = false }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10"
futures-channel = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros"] }
pdf-extract = "0.12"
calamine = "0.38"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Checks TEE replies on the phone (Verify). Path until the repo is published.
obscurify-tee-verify = { git = "https://github.com/Obscurify-ai/tee-verify", rev = "e2a87ede406dbc78e24d069d6c66cbd804c00f55" }
bytes = "1"
# Private sessions: blind-voucher wallet derived from the account number.
unlinkable-inference = "0.2.0"
# Transaction history in the phone's time zone.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1"
arti-client = { version = "0.48", default-features = false, features = ["tokio", "rustls", "onion-service-client", "compression", "static-sqlite", "bridge-client", "pt-client"], optional = true }
tor-rtcompat = { version = "0.48", default-features = false, features = ["tokio", "rustls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
aes-gcm = "0.10"
flate2 = "1"
hmac = "0.12"
sha2 = "0.10"

# The iPhone app (src/ios.rs): links, the clipboard, the screen, Code Mode's sandbox WebView, finishing
# an answer in the background and saying it's ready, and keeping secrets out of backups. All in the
# tree through Dioxus except the notifications.
[target.'cfg(target_os = "ios")'.dependencies]
webbrowser = "1.2"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSURLRequest", "NSError", "NSValue", "NSObject", "NSGeometry", "NSArray"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "UIApplication", "UIResponder", "UIPasteboard", "UIView", "UIWindow", "UIButton", "UIControl", "UILabel", "UIColor", "UIFont", "UIGeometry"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKUserContentController", "WKScriptMessage", "WKScriptMessageHandler", "WKNavigationDelegate", "WKNavigationAction", "WKFrameInfo", "WKNavigation", "WKPreferences"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger", "UNNotificationSound", "UNNotificationSettings"] }

[profile.release]
opt-level = "s"
strip = true
lto = true
